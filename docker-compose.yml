services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fightlens
      POSTGRES_PASSWORD: fightlens
      POSTGRES_DB: fightlens
    ports:
      - "5433:5432"  # host 5433 avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fightlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
